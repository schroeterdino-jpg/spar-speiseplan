name: Preise holen
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: preise
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Preise bei Rewe holen
        run: node tools/preise.js | tee preise.log
      - name: Bericht
        run: echo "::notice title=Preise::$(tr '\n' '|' < preise.log | head -c 6000)"
      - name: Speichern und APK neu bauen lassen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "preise-bot"
          git config user.email "bot@users.noreply.github.com"
          git add daten.js
          git commit -m "Preise aktualisiert (Rewe)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run apk.yml --ref main
