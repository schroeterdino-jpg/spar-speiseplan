name: APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Web-Dateien vorbereiten
        run: |
          mkdir www
          cp index.html app.js daten.js foods.js style.css www/
          cp -r logos www/logos
      - name: Android-Projekt erzeugen
        run: |
          npm install
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/de/schroeter/sparspeiseplan
          cat > android/app/src/main/java/de/schroeter/sparspeiseplan/MainActivity.java <<'EOF'
          package de.schroeter.sparspeiseplan;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onStart() {
              super.onStart();
              // Schriftgröße des Handys soll das Layout nicht sprengen
              this.bridge.getWebView().getSettings().setTextZoom(100);
            }
          }
          EOF
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Fester Schlüssel (damit Updates über die alte App installierbar sind)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: APK bauen
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: APK veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Spar-Speiseplan.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest Spar-Speiseplan.apk --title "Spar-Speiseplan APK (Bau ${{ github.run_number }})" --notes "Neueste APK zum Installieren. Stand: Bau ${{ github.run_number }}."
