name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36'
          for u in 'https://www.rewe.de/api/marketsearch?searchTerm=21493' 'https://www.rewe.de/api/marketselection/zipcodes/21493/services/pickup' 'https://www.rewe.de/api/marketsearch?query=21493' 'https://mobile-api.rewe.de/api/v3/all-offers?marketCode=240237' 'https://shop.rewe.de/api/marketsearch?searchTerm=21493'; do
            echo "URL $u => $(curl -sL -m 30 -A "$UA" -w ' HTTP%{http_code}' "$u" | head -c 500)"
          done
