name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36'
          B='https://www.rewe.de/shop/api/products?search=hackfleisch%20gemischt&objectsPerPage=3&page=1'
          chk(){ node -e 'let s=require("fs").readFileSync("t.json","utf8");try{const j=JSON.parse(s);const it=(j._embedded&&j._embedded.products)||[];const x=it.find(p=>(p._embedded.articles||[]).length);console.log("n="+it.length,"withArticles="+it.filter(p=>(p._embedded.articles||[]).length).length,x?JSON.stringify(x._embedded.articles[0]).slice(0,800):"")}catch(e){console.log("RAW",s.slice(0,200))}'; }
          for q in 'market=565120' 'marketId=565120' 'wwIdent=565120' 'zipCode=21493' 'serviceTypes=PICKUP&market=565120'; do curl -sL -m 30 -A "$UA" "$B&$q" > t.json; echo "Q $q: $(chk)"; done
          J='{"online":{"wwIdent":"565120","marketZipCode":"21521","serviceTypes":["PICKUP"],"customerZipCode":"21493"}}'
          curl -sL -m 30 -A "$UA" -H "Cookie: marketsCookie=$J" "$B" > t.json; echo "Q rawcookie: $(chk)"
          curl -sL -m 30 -A "$UA" -H "Cookie: marketsCookie=$(printf %s "$J" | node -e 'process.stdout.write(encodeURIComponent(require("fs").readFileSync(0,"utf8")))')" -H "x-origin: shop.rewe.de" "$B" > t.json; echo "Q enc+hdr: $(chk)"
